<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎉</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}

/* 💗 BUBBLE BACKGROUND */
.bubble{
  position:fixed;
  border-radius:50%;
  background:rgba(255,105,180,0.4);
  filter:blur(40px);
  z-index:-1;
  animation:rise linear infinite;
}
@keyframes rise{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* ✨ GLOW TEXT */
#title{
  font-size:2rem;
  margin-top:40px;
  text-shadow:
    0 0 5px pink,
    0 0 10px pink,
    0 0 20px hotpink,
    0 0 40px deeppink;
}

#count{
  font-size:4rem;
  font-weight:bold;
  text-shadow:
    0 0 10px pink,
    0 0 20px hotpink,
    0 0 40px deeppink;
  animation:pulseGlow 1s infinite alternate;
}

#message{
  font-size:2.2rem;
  text-shadow:
    0 0 10px pink,
    0 0 20px hotpink,
    0 0 40px deeppink,
    0 0 60px purple;
  animation:pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow{
  from{
    text-shadow:
      0 0 5px pink,
      0 0 10px pink,
      0 0 20px hotpink;
  }
  to{
    text-shadow:
      0 0 10px pink,
      0 0 25px hotpink,
      0 0 50px deeppink;
  }
}

/* 💡 INPUT GLOW */
input{
  padding:12px;
  border:none;
  border-radius:12px;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:16px;
  box-shadow:0 0 10px pink;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:12px;
  background:hotpink;
  color:white;
  font-size:16px;
  box-shadow:0 0 15px pink;
  cursor:pointer;
}

/* VIDEO */
#bgVideo{
  position:fixed;
  top:50%;
  left:50%;
  width:100%;
  height:100%;
  transform:translate(-50%,-50%);
  object-fit:contain;
  z-index:-2;
  display:none;
}
.fullscreen-video{
  object-fit:cover !important;
}

/* HIDE */
#count,#message,#giftBox,#gallery{
  display:none;
}

/* GIFT */
#giftBox{
  position:fixed;
  right:30px;
  bottom:60px;
  font-size:60px;
  cursor:pointer;
  animation:bounce 1s infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* ❤️ HEARTS */
.heart{
  position:fixed;
  color:pink;
  animation:floatHeart linear forwards;
}
@keyframes floatHeart{
  0%{transform:translateY(0); opacity:0;}
  30%{opacity:1;}
  100%{transform:translateY(-100vh); opacity:0;}
}

/* CAROUSEL */
.gallery-wrapper{
  overflow:hidden;
  width:100vw;
  height:260px;
  display:flex;
  align-items:center;
}

.gallery{
  display:flex;
  gap:20px;
  will-change:transform;
}

.card{
  min-width:150px;
  height:210px;
  border-radius:15px;
  overflow:hidden;
  flex-shrink:0;
  opacity:0.3;
  transform:scale(0.85);
  filter:blur(2px);
  transition:0.4s;
}

.card.active{
  transform:scale(1.4);
  opacity:1;
  filter:blur(0);
  box-shadow:0 0 25px pink;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<h2 id="title">Enter Password 🎁</h2>
<input type="password" id="pass">
<br><br>
<button onclick="unlock()">Open</button>

<h1 id="count">3</h1>
<h1 id="message"></h1>

<video id="bgVideo" loop muted playsinline>
  <source src="video.mp4">
</video>

<audio id="music" loop>
  <source src="music.mp3">
</audio>

<div id="giftBox" onclick="openGift()">oooiiiii here-🎁</div>

<div id="gallery">
  <div class="gallery-wrapper">
    <div class="gallery" id="slider">

      <div class="card"><img src="photo1.jpeg"></div>
      <div class="card"><img src="photo2.jpg"></div>
      <div class="card"><img src="photo3.jpeg"></div>
      <div class="card"><img src="photo4.jpeg"></div>
      <div class="card"><img src="photo5.jpeg"></div>
      <div class="card"><img src="photo6.jpeg"></div>
      <div class="card"><img src="photo7.jpeg"></div>

    </div>
  </div>
</div>

<script>

/* 💗 BUBBLES */
for(let i=0;i<25;i++){
  let b=document.createElement("div");
  b.className="bubble";
  let size=50+Math.random()*100;

  b.style.width=size+"px";
  b.style.height=size+"px";
  b.style.left=Math.random()*100+"%";
  b.style.animationDuration=(10+Math.random()*10)+"s";

  document.body.appendChild(b);
}

/* PASSWORD */
function unlock(){
  if(document.getElementById("pass").value==="1234"){

    document.getElementById("title").style.display="none";
    document.getElementById("pass").style.display="none";
    document.querySelector("button").style.display="none";

    let countEl=document.getElementById("count");
    countEl.style.display="block";

    let count=3;

    let interval=setInterval(()=>{
      count--;
      countEl.innerText=count;

      if(count===0){
        clearInterval(interval);

        countEl.style.display="none";
        showMessage();

        let video=document.getElementById("bgVideo");
        video.style.display="block";
        video.play();

        document.getElementById("music").play().catch(()=>{});

        setTimeout(()=>{
          document.getElementById("giftBox").style.display="block";
        },8000);
      }
    },1000);
  } else {
    alert("Wrong password ❌");
  }
}

/* TEXT */
function showMessage(){
  let text="🎉 Happy Birthday! 💖";
  let i=0;
  let el=document.getElementById("message");

  el.style.display="block";

  let t=setInterval(()=>{
    el.innerHTML+=text[i];
    i++;
    if(i>=text.length) clearInterval(t);
  },50);
}

/* GIFT */
function openGift(){
  document.getElementById("giftBox").style.display="none";
  document.getElementById("gallery").style.display="block";

  document.getElementById("bgVideo").classList.add("fullscreen-video");

  startCarousel();
  startHearts();
}

/* ❤️ HEARTS */
function startHearts(){
  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="💖";

    h.style.left=Math.random()*100+"%";
    h.style.bottom="0px";
    h.style.fontSize=(15+Math.random()*25)+"px";
    h.style.animationDuration=(4+Math.random()*4)+"s";

    document.body.appendChild(h);

    setTimeout(()=>h.remove(),7000);
  },300);
}

/* 🔁 CAROUSEL */
function startCarousel(){
  const slider=document.getElementById("slider");

  slider.innerHTML += slider.innerHTML;

  let cards=document.querySelectorAll(".card");

  let pos=0;
  let speed=0.9;

  function animate(){

    pos -= speed;
    slider.style.transform=`translateX(${pos}px)`;

    if(Math.abs(pos)>=slider.scrollWidth/2){
      pos=0;
    }

    let center=window.innerWidth/2;

    cards.forEach(card=>{
      let rect=card.getBoundingClientRect();
      let c=rect.left+rect.width/2;

      if(Math.abs(center-c)<80){
        card.classList.add("active");
      }else{
        card.classList.remove("active");
      }
    });

    requestAnimationFrame(animate);
  }

  animate();
}
</script>

</body>
</html>
